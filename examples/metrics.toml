# Prometheus metrics. `metrics` is a route step that answers with the exposition text, so the
# endpoint is an ordinary site: here on its own loopback listener. Collection runs only while
# some site has a `metrics` step; without one, no request pays for it.

version = 1

[[sites]]
name = "metrics"
hosts = ["*"]
listen = ["127.0.0.1:9100", "[::1]:9100"]
routes = [
  { when.path = "/metrics", metrics = {} },
]

# Request series are labelled by site, by the nearest enclosing named step ("route"), and by
# status class. Unnamed steps share route="". Name the steps you want to see apart:
[[sites]]
name = "blog"
hosts = ["blog.example.com"]
tls = { cert = "/etc/ssl/blog/fullchain.pem", key = "/etc/ssl/blog/key.pem" }
routes = [
  { name = "api",    when.path = "/api/*", proxy = "http://127.0.0.1:4000" },
  { name = "static", files.root = "/srv/blog" },
]

# Serving metrics on a public listener instead, behind a bearer token:
#
# [[sites]]
# name = "status"
# hosts = ["status.example.com"]
# tls = { cert = "...", key = "..." }
# routes = [
#   { when = { path = "/metrics", header.Authorization = "Bearer s3cr3t" }, metrics = {} },
#   { error = 404 },
# ]
#
# `upstreamer check` warns when a `metrics` step without a `when` is reachable on a
# non-loopback address.
