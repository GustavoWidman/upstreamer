[package]
name = "bench-origin"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace]

[dependencies]
httparse = "1"
socket2 = { version = "0.5", features = ["all"] }
tokio = { version = "1", features = ["rt", "net", "io-util"] }

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"
