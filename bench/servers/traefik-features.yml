global:
  checkNewVersion: false
  sendAnonymousUsage: false

log:
  level: WARN

entryPoints:
  h1:
    address: "{{host}}:{{h1_port}}"
    transport:
      respondingTimeouts:
        idleTimeout: 75s
{{forwarded}}
  tls:
    address: "{{host}}:{{tls_port}}"
    transport:
      respondingTimeouts:
        idleTimeout: 75s
{{forwarded}}
    http:
      tls: {}
    http3: {}
{{entrypoints_extra}}
{{static_extra}}

serversTransport:
  maxIdleConnsPerHost: 256

providers:
  file:
    filename: "{{run_dir}}/traefik-dynamic-features.yml"
    watch: false
