daemon off;
worker_processes {{workers}};
worker_rlimit_nofile 1048576;
pid {{run_dir}}/nginx.pid;
error_log stderr warn;

events {
    worker_connections 65536;
}

http {
    access_log off;
    default_type application/octet-stream;
    types {
        text/html html;
    }

    sendfile on;
    tcp_nopush on;
    keepalive_requests 1000000;
    keepalive_timeout 75s;
    client_max_body_size 16m;
    proxy_request_buffering off;
    proxy_max_temp_file_size 0;

    client_body_temp_path {{run_dir}}/client_body;
    proxy_temp_path {{run_dir}}/proxy;
    fastcgi_temp_path {{run_dir}}/fastcgi;
    uwsgi_temp_path {{run_dir}}/uwsgi;
    scgi_temp_path {{run_dir}}/scgi;

    ssl_protocols TLSv1.3;
    ssl_certificate {{cert}};
    ssl_certificate_key {{key}};
    ssl_session_cache shared:SSL:10m;
{{http_extra}}
    upstream origin {
{{upstream}}
        keepalive 256;
        keepalive_requests 1000000;
        keepalive_timeout 60s;
    }

    server {
        listen {{host}}:{{h1_port}} reuseport backlog=4096;

        location / {
            proxy_pass http://origin;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
{{location_extra}}
        }
    }

    server {
        listen {{host}}:{{tls_port}} ssl reuseport backlog=4096;
        listen {{host}}:{{tls_port}} quic reuseport;
        http2 on;
        http3 on;
        quic_gso on;
        add_header Alt-Svc 'h3=":{{tls_port}}"; ma=86400' always;

        location / {
            proxy_pass http://origin;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
{{location_extra}}
        }
    }

    server {
        listen {{host}}:{{static_port}} ssl reuseport backlog=4096;
        http2 on;
        root {{www}};
        open_file_cache max=1000 inactive=60s;
    }
{{servers_extra}}
}
