global
    nbthread {{workers}}
    maxconn 100000
    ssl-default-bind-options ssl-min-ver TLSv1.3

defaults
    mode http
    maxconn 100000
    option http-keep-alive
    timeout connect 5s
    timeout client 75s
    timeout server 75s
    timeout http-request 10s
    timeout http-keep-alive 75s
    default_backend origin

frontend h1
    bind {{host}}:{{h1_port}} backlog 4096
{{frontend_extra}}

frontend tls
    bind {{host}}:{{tls_port}} ssl crt {{cert_and_key}} alpn h2,http/1.1 backlog 4096
    bind quic4@{{host}}:{{tls_port}} ssl crt {{cert_and_key}} alpn h3
    http-after-response add-header alt-svc 'h3=":{{tls_port}}"; ma=900'
{{frontend_extra}}

backend origin
{{backend}}

{{sections_extra}}
