server.modules = ( "mod_openssl", "mod_proxy" )

server.bind = "{{host}}"
server.port = {{static_port}}
server.document-root = "{{www}}"
server.pid-file = "{{run_dir}}/lighttpd.pid"
server.upload-dirs = ( "{{run_dir}}" )
server.tag = "lighttpd"

server.max-worker = {{workers}}
server.max-fds = 65536
server.max-connections = 16384
server.listen-backlog = 4096

server.max-keep-alive-requests = 65535
server.max-keep-alive-idle = 75
server.max-read-idle = 60
server.max-write-idle = 360

server.stream-request-body = 2
server.stream-response-body = 2

mimetype.assign = ( ".html" => "text/html" )

ssl.engine = "enable"
ssl.pemfile = "{{cert}}"
ssl.privkey = "{{key}}"
ssl.openssl.ssl-conf-cmd = ( "MinProtocol" => "TLSv1.3" )

$SERVER["socket"] == "{{host}}:{{tls_port}}" {
    ssl.engine = "enable"
    proxy.server = ( "" => ( ( "host" => "{{origin_host}}", "port" => {{origin_port}} ) ) )
}

$SERVER["socket"] == "{{host}}:{{h1_port}}" {
    ssl.engine = "disable"
    proxy.server = ( "" => ( ( "host" => "{{origin_host}}", "port" => {{origin_port}} ) ) )
}
