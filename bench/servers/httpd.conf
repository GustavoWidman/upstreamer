ServerRoot {{pkg}}
ServerName {{host}}
PidFile {{run_dir}}/httpd.pid
DefaultRuntimeDir {{run_dir}}
ErrorLog /dev/stderr
LogLevel warn

LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule mime_module modules/mod_mime.so
LoadModule socache_shmcb_module modules/mod_socache_shmcb.so
LoadModule ssl_module modules/mod_ssl.so
LoadModule http2_module modules/mod_http2.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so

StartServers {{workers}}
ServerLimit {{workers}}
ThreadLimit ${HTTPD_THREADS_PER_CHILD}
ThreadsPerChild ${HTTPD_THREADS_PER_CHILD}
MaxRequestWorkers ${HTTPD_MAX_REQUEST_WORKERS}
MinSpareThreads 1
MaxSpareThreads ${HTTPD_MAX_REQUEST_WORKERS}
AsyncRequestWorkerFactor 16
MaxConnectionsPerChild 0
ListenBacklog 4096
ListenCoresBucketsRatio ${HTTPD_LISTEN_CORES_BUCKETS_RATIO}

KeepAlive On
MaxKeepAliveRequests 0
KeepAliveTimeout 75
Timeout 60
HostnameLookups Off
TypesConfig conf/mime.types

SSLProtocol -all +TLSv1.3
SSLCertificateFile {{cert}}
SSLCertificateKeyFile {{key}}
SSLSessionCache shmcb:{{run_dir}}/ssl_scache(512000)

Listen {{host}}:{{h1_port}}
Listen {{host}}:{{tls_port}}
Listen {{host}}:{{static_port}}

<VirtualHost {{host}}:{{h1_port}}>
    ProxyPass / http://{{origin}}/
</VirtualHost>

<VirtualHost {{host}}:{{tls_port}}>
    Protocols h2 http/1.1
    SSLEngine on
    ProxyPass / http://{{origin}}/
</VirtualHost>

<VirtualHost {{host}}:{{static_port}}>
    Protocols h2 http/1.1
    SSLEngine on
    DocumentRoot {{www}}
    EnableSendfile On
    <Directory {{www}}>
        Require all granted
    </Directory>
</VirtualHost>
