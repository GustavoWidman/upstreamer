[package]
name = "upstreamer"
version = "0.3.2"
edition = "2024"
description = "A reverse proxy and static file server for NixOS hosts"
license = "MIT"
publish = false

[dependencies]
# One current-thread tokio runtime per core, epoll through AsyncFd.
tokio = { version = "1.54", default-features = false, features = ["rt", "net", "time", "sync", "signal", "io-util", "macros"] }
socket2 = { version = "0.6.5", features = ["all"] }
libc = "0.2.191"
# The global allocator. Without no_thp it madvises its arenas into transparent huge pages, which
# pins most of a 2 MiB page behind every few live objects: 10k idle TLS connections then hold
# 77 to 86 MiB instead of 45.
mimalloc = { version = "0.1.52", default-features = false, features = ["no_thp"] }

# HTTP/1.1 is our own codec; httparse only tokenises heads.
httparse = "1.10.1"
bytes = "1.12"
smallvec = { version = "1.16", features = ["union", "const_generics"] }
memchr = "2.8"

# HTTP/3 downstream, adapted into the same heads and pipeline (HTTP/2 is our own).
http = "1.5"
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs"] }
h3 = "0.0.8"
h3-quinn = "0.0.10"

# TLS: rustls on aws-lc-rs; certificates from PEM files, a self-signed stand-in per name
# while a pair is missing.
rustls = { version = "0.23.46", default-features = false, features = ["std", "tls12", "aws_lc_rs", "prefer-post-quantum"] }
rustls-pki-types = { version = "1.16", features = ["std"] }
aws-lc-rs = "1.19"
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "crypto"] }

# Config and plan.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_path_to_error = "0.1.20"
# TOML configs, converted to the JSON value the schema reads; spans for diagnostics.
toml_edit = { version = "0.25.19", default-features = false, features = ["parse"] }
regex-automata = { version = "0.4.18", default-features = false, features = ["std", "syntax", "perf", "unicode", "meta", "hybrid", "dfa-onepass", "nfa-backtrack"] }
rustc-hash = "2.1"

# Kubernetes discovery (feature `kubernetes`): kubeconfig files are YAML. Nothing else is added:
# the API client is our own HTTP/1.1 over rustls and tokio, with httparse and serde_json above.
saphyr = { version = "0.3.4", optional = true, default-features = false }

# Dynamic compression.
zstd = { version = "0.14.4", default-features = false }
flate2 = { version = "1.1.11", default-features = false, features = ["zlib-rs"] }

[features]
# Codec entry points for fuzz/ and benches/; not part of the API. The connection targets
# drive the drivers on tokio's paused clock.
internals = ["tokio/test-util"]
# Origins from Kubernetes EndpointSlices (`proxy.to.kubernetes`). Off by default: a default
# build carries no Kubernetes client, and a config that names a source fails `check` with a
# message naming this feature.
kubernetes = ["dep:saphyr"]

[dev-dependencies]
proptest = "1.12"
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
tempfile = "3.27"
# The HTTP/2 client of the end-to-end tests.
h2 = "0.4.20"
# examples/bench-backend.rs
hyper = { version = "1.12", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "test-util"] }

[[bench]]
name = "codec"
harness = false
required-features = ["internals"]

[[bench]]
name = "balance"
harness = false
required-features = ["internals"]

[[bench]]
name = "limit"
harness = false
required-features = ["internals"]

[[bench]]
name = "metrics"
harness = false
required-features = ["internals"]

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
debug = "line-tables-only"
